<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wanghenan.github.io</title>
    <script>
      // SPA fallback for GitHub Pages - redirect all 404s to index.html
      // This allows React Router to handle the routing
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== window.location.href) {
          history.replaceState(null, null, redirect);
          return;
        }
        // For direct 404s, redirect to home page
        window.location.replace('/');
      })();
    </script>
    <noscript>Redirecting to <a href="/">home page</a>...</noscript>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
